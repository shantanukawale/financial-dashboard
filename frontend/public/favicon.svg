<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Upward trend">
  <defs>
    <!-- refX set back from tip so arrowhead extends past the line end -->
    <marker
      id="arrow-axis"
      viewBox="0 0 6 5"
      refX="2.5"
      refY="2.5"
      markerWidth="4"
      markerHeight="3.5"
      orient="auto"
      markerUnits="userSpaceOnUse"
    >
      <path d="M0,0.5 L5.6,2.5 L0,4.5 Z" fill="#111111" />
    </marker>
    <marker
      id="arrow-trend"
      viewBox="0 0 7 6"
      refX="2.7"
      refY="3"
      markerWidth="4.5"
      markerHeight="4"
      orient="auto"
      markerUnits="userSpaceOnUse"
    >
      <path d="M0,0.7 L6.3,3 L0,5.3 Z" fill="#0f766e" />
    </marker>
  </defs>
  <rect
    width="32"
    height="32"
    rx="6"
    fill="#ffffff"
    stroke="#e2e8f0"
    stroke-width="0.75"
  />
  <line
    x1="6"
    y1="26"
    x2="6"
    y2="7.5"
    stroke="#111111"
    stroke-width="1.25"
    stroke-linecap="round"
    marker-end="url(#arrow-axis)"
  />
  <line
    x1="6"
    y1="26"
    x2="24.5"
    y2="26"
    stroke="#111111"
    stroke-width="1.25"
    stroke-linecap="round"
    marker-end="url(#arrow-axis)"
  />
  <polyline
    fill="none"
    stroke="#0f766e"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="7,24 10,18 13,20 16,11 18,12 20.5,6.5"
    marker-end="url(#arrow-trend)"
  />
</svg>
